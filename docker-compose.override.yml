version: "3.9"

services:
  backend:
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/**/*.pyc
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
